name: sat55

# The 55-member step: refutes the four configurations of checks/sat/run_sat55.sh
# with CaDiCaL, checking each LRAT proof as it is written.
# Long runs; started by hand or by a push that changes the encoder.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-9quuz3]
    paths: [checks/sat/family_cnf.py, checks/sat/run_sat55.sh, .github/workflows/sat55.yml]

jobs:
  refute:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        case: [boundary, i-a, i-b, ii]
    steps:
      - uses: actions/checkout@v4
      - name: Build CaDiCaL and lrat-check
        run: |
          git clone --depth 1 --branch rel-2.1.3 https://github.com/arminbiere/cadical "$RUNNER_TEMP/cadical"
          (cd "$RUNNER_TEMP/cadical" && ./configure > /dev/null && make -j2 > /dev/null)
          git clone --depth 1 https://github.com/marijnheule/drat-trim "$RUNNER_TEMP/drat-trim"
          (cd "$RUNNER_TEMP/drat-trim" && gcc -O2 -o lrat-check lrat-check.c)
          echo "CADICAL=$RUNNER_TEMP/cadical/build/cadical" >> "$GITHUB_ENV"
          echo "LRATCHECK=$RUNNER_TEMP/drat-trim/lrat-check" >> "$GITHUB_ENV"
      - name: Refute ${{ matrix.case }}
        run: bash checks/sat/run_sat55.sh ${{ matrix.case }} | tee result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sat55-${{ matrix.case }}
          path: result.txt
