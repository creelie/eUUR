name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4, checked by the kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean project and check the axioms
        run: CHECKS="" bash scripts/run_all.sh

  checks:
    name: Check (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [python, julia, c, cpp, sat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.check == 'python'
        with:
          python-version: "3.12"
      - if: matrix.check == 'python'
        run: python3 -m pip install -r checks/python/requirements.txt
      - uses: julia-actions/setup-julia@v2
        if: matrix.check == 'julia'
        with:
          version: "1.10"
      - name: Build CaDiCaL and drat-trim
        if: matrix.check == 'sat'
        run: |
          git clone -q https://github.com/arminbiere/cadical.git "$RUNNER_TEMP/cadical"
          git -C "$RUNNER_TEMP/cadical" checkout -q c60730422e758ef1cebe7aeddf2dda31c996bf04
          ( cd "$RUNNER_TEMP/cadical" && ./configure > /dev/null && make -j4 > /dev/null )
          git clone -q https://github.com/marijnheule/drat-trim.git "$RUNNER_TEMP/drat-trim"
          git -C "$RUNNER_TEMP/drat-trim" checkout -q 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C "$RUNNER_TEMP/drat-trim" > /dev/null
          echo "$RUNNER_TEMP/cadical/build" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/drat-trim" >> "$GITHUB_PATH"
      - run: SKIP_LEAN=1 CHECKS=${{ matrix.check }} bash scripts/run_all.sh

  paper:
    name: Build the paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-publishers texlive-pictures cm-super lmodern zip unzip
      - run: bash scripts/build_paper.sh
